<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#374151"/></marker>
    <style>
      text{font-family:Arial,sans-serif}.title{font-size:28px;font-weight:bold;fill:#172554}.box{fill:#6f91ed;stroke:#172554;stroke-width:2}.actor{font-size:15px;font-weight:bold;fill:white;text-anchor:middle}.life{stroke:#64748b;stroke-width:1.6;stroke-dasharray:7 5}.msg{stroke:#374151;stroke-width:1.8;marker-end:url(#arrow)}.ret{stroke:#4b9b57;stroke-width:1.8;stroke-dasharray:7 5;marker-end:url(#arrow)}.label{font-size:14px;font-weight:bold;fill:#273449;text-anchor:middle}.green{fill:#3f914d}.phase{font-size:18px;font-weight:bold;fill:#172554;text-anchor:middle}.small{font-size:13px;fill:#475569;text-anchor:middle}.caption{font-size:16px;fill:#334155;text-anchor:middle}
    </style>
  </defs>
  <rect width="1600" height="1300" fill="white"/>
  <text x="800" y="38" class="title" text-anchor="middle">Génération et alignement des AAD avec les AC</text>

  <g>
    <rect x="25" y="60" width="170" height="44" rx="6" class="box"/><text x="110" y="87" class="actor">Resp. formation</text>
    <rect x="245" y="60" width="170" height="44" rx="6" class="box"/><text x="330" y="87" class="actor">Responsable d'EC</text>
    <rect x="465" y="60" width="170" height="44" rx="6" class="box"/><text x="550" y="87" class="actor">Application Angular</text>
    <rect x="685" y="60" width="170" height="44" rx="6" class="box"/><text x="770" y="87" class="actor">API Flask</text>
    <rect x="905" y="60" width="170" height="44" rx="6" class="box"/><text x="990" y="87" class="actor">Agent AAD</text>
    <rect x="1125" y="60" width="170" height="44" rx="6" class="box"/><text x="1210" y="87" class="actor">Moteur d'alignement</text>
    <rect x="1345" y="60" width="170" height="44" rx="6" class="box"/><text x="1430" y="87" class="actor">BDD / JSON</text>
    <path d="M110 104V1320M330 104V1320M550 104V1320M770 104V1320M990 104V1320M1210 104V1320M1430 104V1320" class="life"/>
  </g>

  <rect x="55" y="125" width="1400" height="42" fill="#fff19a" opacity=".95"/><text x="755" y="152" class="phase">Phase 1 — Constitution du référentiel de formation</text>
  <line x1="110" y1="200" x2="550" y2="200" class="msg"/><text x="330" y="190" class="label">Saisir un apprentissage critique (AC)</text>
  <line x1="550" y1="245" x2="770" y2="245" class="msg"/><text x="660" y="235" class="label">POST /api/ac</text>
  <line x1="770" y1="290" x2="1430" y2="290" class="msg"/><text x="1100" y="280" class="label">Enregistrer l'AC et mettre à jour ac_{formation}.json</text>
  <line x1="1430" y1="335" x2="770" y2="335" class="ret"/><text x="1100" y="325" class="label green">AC enregistré</text>
  <line x1="770" y1="380" x2="110" y2="380" class="ret"/><text x="440" y="370" class="label green">Identifiant et confirmation</text>

  <rect x="55" y="415" width="1400" height="42" fill="#cfe4ff" opacity=".95"/><text x="755" y="442" class="phase">Phase 2 — Identification des AAD à partir des supports de cours</text>
  <line x1="330" y1="490" x2="550" y2="490" class="msg"/><text x="440" y="480" class="label">Déposer les cours PDF</text>
  <line x1="550" y1="535" x2="770" y2="535" class="msg"/><text x="660" y="525" class="label">POST /api/identify</text>
  <line x1="770" y1="580" x2="990" y2="580" class="msg"/><text x="880" y="570" class="label">Lancer generation_worker</text>
  <path d="M990 615h100v42H990" fill="none" class="msg"/><text x="1040" y="605" class="small">Extraire les PDF</text><text x="1040" y="679" class="small">Générer les AAD avec l'IA</text>
  <line x1="990" y1="715" x2="770" y2="715" class="ret"/><text x="880" y="705" class="label green">Liste structurée des AAD</text>
  <line x1="770" y1="760" x2="1430" y2="760" class="msg"/><text x="1100" y="750" class="label">Écrire aad_{matière}.json</text>
  <line x1="770" y1="805" x2="330" y2="805" class="ret"/><text x="550" y="795" class="label green">Afficher les AAD proposés</text>
  <line x1="330" y1="850" x2="550" y2="850" class="msg"/><text x="440" y="840" class="label">Sélectionner les AAD pertinents</text>
  <line x1="550" y1="895" x2="1430" y2="895" class="msg"/><text x="990" y="885" class="label">Enregistrer aad_selection_{matière}.json</text>

  <rect x="55" y="930" width="1400" height="42" fill="#d9f4d8" opacity=".95"/><text x="755" y="957" class="phase">Phase 3 — Alignement sémantique AAD–AC</text>
  <line x1="330" y1="1005" x2="770" y2="1005" class="msg"/><text x="550" y="995" class="label">Lancer l'alignement — POST /api/align/json</text>
  <line x1="770" y1="1050" x2="1430" y2="1050" class="msg"/><text x="1100" y="1040" class="label">Charger le catalogue des AC</text>
  <line x1="770" y1="1095" x2="1210" y2="1095" class="msg"/><text x="990" y="1085" class="label">AAD + AC + seuil</text>
  <path d="M1210 1125h115v42h-115" fill="none" class="msg"/><text x="1268" y="1117" class="small">Sentence-CamemBERT</text><text x="1268" y="1188" class="small">Similarité cosinus</text>
  <line x1="1210" y1="1215" x2="770" y2="1215" class="ret"/><text x="990" y="1205" class="label green">AC candidats, scores et meilleur résultat</text>
  <line x1="770" y1="1250" x2="330" y2="1250" class="ret"/><text x="550" y="1240" class="label green">Afficher et télécharger alignment_{matière}.json</text>

  <text x="800" y="1370" class="caption">Flux centralisé de génération et d'alignement des acquis d'apprentissage disciplinaires (AAD) avec les apprentissages critiques (AC).</text>
</svg>
