<div class="container">
  <div class="topbar">
    <div class="brand">
      <div class="logo">AI</div>
      <div>
        <h1>Identification des AAD</h1>
        <p>Dépose un ou plusieurs cours PDF puis génère leurs AAD.</p>
      </div>
    </div>
    <span class="badge">v0.1 • Identify</span>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="section-title">Téléverser les cours</div>

      <input
        class="input"
        type="file"
        accept="application/pdf"
        multiple
        (change)="onFileChange($event)"
      />

      <div style="margin-top: 12px;">
        <button class="btn btn-primary" (click)="identify()" [disabled]="loading">
          {{ loading ? 'Extraction et génération en cours...' : 'Générer les AAD' }}
        </button>

        <button class="btn" style="margin-left: 10px;" (click)="back()" [disabled]="loading">
          Retour
        </button>
      </div>

      <p class="hint" *ngIf="error">{{ error }}</p>

      <div *ngIf="aads.length > 0">
        <div class="results-head">
          <div class="section-title">AAD identifiés</div>
          <span class="pill">{{ aads.length }} trouvés</span>
        </div>

        <div class="grid">
          <label class="item selectable" *ngFor="let item of aads" [class.selected]="isSelected(item.aad_id)">
            <input
              class="aad-checkbox"
              type="checkbox"
              [checked]="isSelected(item.aad_id)"
              (change)="toggleAAD(item.aad_id, $any($event.target).checked)"
            />
            <div>
              <p class="item-title">{{ item.aad_id }} — {{ item.formulation }}</p>
              <p class="item-sub">
                Notion : {{ item.disciplinary_concept }} • Pages : {{ item.source_pages.join(', ') }}
              </p>
              <p class="item-sub">{{ item.course_grounding }}</p>
            </div>
          </label>
        </div>

        <div class="selection-actions">
          <span class="pill">{{ selectedAadIds.size }} sélectionné(s)</span>
          <button class="btn btn-primary" (click)="saveSelection()" [disabled]="savingSelection">
            {{ savingSelection ? 'Enregistrement...' : 'Enregistrer la sélection' }}
          </button>
          <button class="btn" *ngIf="selectionSaved" (click)="downloadSelection()">
            Télécharger le JSON
          </button>
        </div>

        <p class="success-message" *ngIf="selectionMessage">✓ {{ selectionMessage }}</p>
        <p class="hint" *ngIf="selectionError">{{ selectionError }}</p>
      </div>

      <div class="empty" *ngIf="!loading && aads.length === 0 && files.length > 0 && !error">
        Aucun résultat pour l’instant.
      </div>
    </div>
  </div>
</div>
