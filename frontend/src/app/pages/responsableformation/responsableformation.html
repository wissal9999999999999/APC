<div class="container">

  <div class="topbar">
    <div>
      <h1>Responsable de formation</h1>
      <p class="subtitle">
        Formation : <span class="pill">{{ formationId }}</span>
      </p>
    </div>

    <button class="ghost" type="button" (click)="back()">← Retour</button>
  </div>

  <div class="grid">

    <!-- Savoir-agir -->
    <div class="block">
      <h2>Savoir-agir</h2>

<select
  [(ngModel)]="selectedSavoirAgirId"
  (ngModelChange)="onSavoirChange()">

  <option [ngValue]="null">-- Choisir un savoir-agir --</option>

  <option *ngFor="let s of savoirAgirList; trackBy: trackById"
          [ngValue]="s.id">
    {{ s.name }}
  </option>

</select>
    </div>

    <!-- Jalons -->
    <div class="block">
      <h2>Jalon</h2>

      <select [(ngModel)]="selectedJalonId">

        <option [ngValue]="null">-- Choisir un jalon --</option>

        <option *ngFor="let j of jalonsList"
                [ngValue]="j.id">
          {{ j.name }}
        </option>

      </select>
    </div>

    <!-- AC -->
    <div class="block">
      <h2>Apprentissage critique (AC)</h2>

      <input type="text"
             [(ngModel)]="newAC"
             placeholder="Tapez votre AC…" />

      <button class="btn"
              (click)="addAC()">
        Ajouter AC
      </button>
    </div>

  </div>

  <div class="actions">
    <button class="btn primary"
            (click)="generateAndDownloadJSON()">
      Générer et Télécharger JSON
    </button>
  </div>

</div>
